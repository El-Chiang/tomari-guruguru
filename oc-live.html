<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トマリ ライブ（レイヤー）</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  img { -webkit-user-drag: none; }

  /* レイヤーアニメーション。振幅/速度は CSS 変数で oc-live.jsx から上書き。
     視線(--gaze-x/y)は JS が毎フレーム更新する -1..1 の数値 */
  :root {
    --hair-amp: 2deg;     --hair-dur: 3.6s;
    --breathe-dur: 4s;
    --tilt-amp: 2.5deg;   --tilt-dur: 5s;
    --sway-amp: 1.5deg;   --sway-dur: 6s;
    --eye-amp-x: 0.6%;    --eye-amp-y: 0.4%;
    --brow-amp: 0.66%;    --brow-dur: 7s;
    --gaze-x: 0;          --gaze-y: 0;
  }

  /* 視線・まばたきはポインタ/JS駆動なので常時有効にしておく */
  .ly-eyemove {
    will-change: transform;
    transform: translate(calc(var(--gaze-x, 0) * var(--eye-amp-x, 0%)),
                         calc(var(--gaze-y, 0) * var(--eye-amp-y, 0%)));
  }
  .ly-eyes { transform-origin: 50% 40%; transition: transform 90ms ease; }
  .ly-eyes.blinking { transform: scaleY(0.06); }

  @media (prefers-reduced-motion: no-preference) {
    .bob { animation: bob 3.4s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -1.2vmin; }
    }

    /* 髪の揺れ: クラウン付近を支点に左右へ */
    .ly-hair {
      transform-origin: 50% 18%;
      animation: hairSway var(--hair-dur) ease-in-out infinite;
    }
    @keyframes hairSway {
      0%, 100% { transform: rotate(calc(var(--hair-amp) * -1)); }
      50%      { transform: rotate(var(--hair-amp)); }
    }

    /* 呼吸: 下端支点でわずかに伸縮＋上下 */
    .ly-breathe {
      transform-origin: 50% 100%;
      animation: breathe var(--breathe-dur) ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scaleY(1) translateY(0); }
      50%      { transform: scaleY(1.012) translateY(-0.4%); }
    }

    /* 首かしげ: 首の付け根を支点に頭部グループを左右へ傾ける */
    .ly-tilt {
      transform-origin: 50% 72%;
      animation: headTilt var(--tilt-dur) ease-in-out infinite;
    }
    @keyframes headTilt {
      0%, 100% { transform: rotate(calc(var(--tilt-amp) * -1)); }
      50%      { transform: rotate(var(--tilt-amp)); }
    }

    /* 体ゆれ: 下端支点で全身をゆっくり左右へ */
    .ly-sway {
      transform-origin: 50% 100%;
      animation: bodySway var(--sway-dur) ease-in-out infinite;
    }
    @keyframes bodySway {
      0%, 100% { transform: rotate(calc(var(--sway-amp) * -1)); }
      50%      { transform: rotate(var(--sway-amp)); }
    }

    /* 眉: 大半は静止、たまにピクッと上げる */
    .ly-brow { animation: browRaise var(--brow-dur) ease-in-out infinite; }
    @keyframes browRaise {
      0%, 62%, 100% { transform: translateY(0); }
      70%, 82%      { transform: translateY(calc(var(--brow-amp, 0%) * -1)); }
    }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="src/tweaks-panel.jsx"></script>
<script type="module" src="src/oc-live.jsx"></script>
</body>
</html>
